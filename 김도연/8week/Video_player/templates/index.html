<!DOCTYPE html>
<html>
  <head>
    <title>Video Player</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f0f0f0;
      }

      h1 {
        text-align: center;
        margin: 20px 0;
      }

      form {
        text-align: center;
        margin: 20px 0;
      }

      table {
        width: 80%;
        margin: 0 auto;
        border-collapse: collapse;
        border: 1px solid #ccc;
      }

      th,
      td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: left;
      }

      th {
        background-color: #f2f2f2;
      }

      tr:nth-child(even) {
        background-color: #f2f2f2;
      }

      a {
        text-decoration: none;
        color: #007bff;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Video Player</h1>

    <form method="POST" enctype="multipart/form-data">
      <input type="file" name="file" multiple />
      <input type="submit" value="Upload" />
    </form>

    <table>
      <tr>
        <th>File Name</th>
        <th>File Size</th>
        <th>Upload Date</th>
      </tr>
      {% for file in files %}
      <tr>
        <td>
          <a href="{{ url_for('static', filename='uploads/' + file.filename) }}"
            >{{ file.filename }}</a
          >
        </td>
        <td>{{ file.filesize }}</td>
        <td>{{ file.upload_date }}</td>
      </tr>
      {% endfor %}
    </table>
  </body>
</html>
