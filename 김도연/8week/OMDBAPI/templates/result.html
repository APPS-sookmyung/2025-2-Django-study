<!DOCTYPE html>
<html>
  <head>
    <title>Movie Search Results</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container my-5">
      <h1 class="mb-4">Movie Search Results</h1>
      <table class="table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Year</th>
            <th>Poster</th>
          </tr>
        </thead>
        <tbody>
          {% for movie in movies %}
          <tr>
            <td>{{ movie.title }}</td>
            <td>{{ movie.year }}</td>
            <td>
              <img
                src="{{ movie.poster }}"
                alt="{{ movie.title }} poster"
                class="img-thumbnail"
              />
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>
